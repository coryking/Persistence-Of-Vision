; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env]
build_flags =
    -std=c++17
    ; -DDO_FANCY_SHIT  ; Enable the FastLED test code
    -DFASTLED_ALL_PINS_HARDWARE_SPI
    -DFASTLED_ESP32_SPI_BUS=FSPI
    '-D ARDUINO_USB_CDC_ON_BOOT=1'
    -DFASTLED_ESP32_SPI_BULK_TRANSFER=1
    -DFASTLED_RMT5=1
lib_deps =
    symlink:///Users/coryking/projects/FastLED

[env:seeed_xiao_esp32s3]
; Use same platform as FastLED dev (newer Arduino framework)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
build_flags = ${env.build_flags} -O3 -ffast-math -finline-functions -funroll-loops
upload_port=/dev/cu.usbmodem2101
monitor_port=/dev/cu.usbmodem2101
monitor_speed = 115200



[env:lolin_s3_mini_debug]
; Use same platform as FastLED dev (newer Arduino framework)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -ggdb
    -gdwarf-4
    -fvar-tracking-assignments
    -fno-omit-frame-pointer
    -Og
    -g3
    -save-temps=obj
upload_port=/dev/cu.usbmodem2101
monitor_port=/dev/cu.usbmodem2101
debug_tool = esp-builtin
debug_init_break = break setup
build_type = debug      ;build in debug mode instead of release mode