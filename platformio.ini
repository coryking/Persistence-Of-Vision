; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Set default environment to prevent building all envs on upload
default_envs = seeed_xiao_esp32s3

[env]
build_flags =
	'-D ARDUINO_USB_CDC_ON_BOOT=1'
lib_deps =
    ; Use coryking fork with ESP-IDF 5.5 fix (until upstream merges)
    https://github.com/coryking/NeoPixelBus.git#esp-idf-5.5-fix
    ; Pulling master for new cylinder noise functions (noiseCylinderCRGB, etc.)
    ; Last release 3.10.3 was Sept 2024, these were added Oct 2024
    https://github.com/FastLED/FastLED.git

[env:seeed_xiao_esp32s3]
; pioarduino community platform (Arduino Core 3.3.4, ESP-IDF 5.5.1)
; Official PlatformIO support ended at Core 2.x - community maintains this fork
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
build_flags = ${env.build_flags} -O3 -ffast-math -finline-functions -funroll-loops
#upload_port=/dev/cu.usbmodem2101
#monitor_port=/dev/cu.usbmodem2101

[env:seeed_xiao_esp32s3_gcov]
; GCOV profiling - minimal ESP-IDF just for app_trace
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino, espidf
board_build.esp-idf.sdkconfig_path = sdkconfig.gcov
build_flags =
    ${env.build_flags}
    -O3 -ffast-math -finline-functions -funroll-loops
    -DTEST_MODE
build_src_flags =
    -fprofile-arcs
    -ftest-coverage
#upload_port=/dev/cu.usbmodem2101
#monitor_port=/dev/cu.usbmodem2101

[env:seeed_xiao_esp32s3_profiling]
; Profiling build with detailed timing instrumentation and test mode
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino, espidf
board_build.esp-idf.ignore_components = esp_https_server, esp_https_ota
extra_scripts =
    pre:generate_certs.py
    post:add_gcov_lib.py
build_flags =
    ${env.build_flags}
    -Og                                # Optimize for debugging (REQUIRED for GCOV)
    -DTEST_MODE                        # Simulates rotation without hall sensor
    -DCONFIG_FREERTOS_HZ=1000
    -DCONFIG_FREERTOS_NUMBER_OF_CORES=2
build_src_flags =
    --coverage                         # Enable GCOV for application source (src/*.cpp)
build_unflags =
    -lgcov_rtio_target                 # Remove Arduino's gcov wrapper
#upload_port=/dev/cu.usbmodem2101
#monitor_port=/dev/cu.usbmodem2101
debug_tool = esp-builtin
debug_init_break = break setup



[env:seeed_xiao_esp32s3_debug]
; pioarduino community platform (Arduino Core 3.3.4, ESP-IDF 5.5.1)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -ggdb
    -gdwarf-4
    -fvar-tracking-assignments
    -fno-omit-frame-pointer
    -Og
    -g3
    -save-temps=obj
#upload_port=/dev/cu.usbmodem2101
#monitor_port=/dev/cu.usbmodem2101
debug_tool = esp-builtin
debug_init_break = break setup
build_type = debug      ;build in debug mode instead of release mode